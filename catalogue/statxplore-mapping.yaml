# catalogue/statxplore-mapping.yaml — bind soundings indicator keys to
# DWP Stat-Xplore cube queries.
#
# Cube identifiers (`database`, `measures`, `dimensions`, `recodes`) are
# long strings that must match Stat-Xplore's internal schema exactly.
# Discovery requires the API key. The Universal Credit mapping below was
# live-verified against the authenticated schema on 29 August 2026.
#
# Two older speculative mappings (claimant-count rate and child-poverty AHC
# proportion) were removed after live schema inspection showed that their
# pinned database IDs were stale and the current Stat-Xplore products expose
# counts rather than the proportion-shaped measures those Soundings contracts
# advertised. Reintroduce them only with an explicit, tested derivation.
#
# `geography_dim` is the dimension we filter on by place_id; the
# adapter recodes it per request. `date_dim` is the time axis used
# by fetch_trend.
#
# Geography hierarchy IDs vary per cube. The value template uses
# `{place_code}` which the adapter substitutes (e.g. E06000004).

mappings:

  - indicator_key: economy.universal_credit_claimants
    database: "str:database:UC_Monthly"
    measures:
      - "str:count:UC_Monthly:V_F_UC_CASELOAD_FULL"
    geography_dim: "str:field:UC_Monthly:V_F_UC_CASELOAD_FULL:COA_CODE"
    geography_value_template:
      "str:value:UC_Monthly:V_F_UC_CASELOAD_FULL:COA_CODE:V_C_MASTERGEOG21_LA_TO_REGION:{place_code}"
    date_dim: "str:field:UC_Monthly:F_UC_DATE:DATE_NAME"
    place_type: ltla24
    unit: "people"

