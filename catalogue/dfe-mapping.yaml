# catalogue/dfe-mapping.yaml — bind soundings indicator keys to DfE
# Explore Education Statistics datasets.
#
# Each entry pins a dataset UUID + indicator ID + a `filter_selection`
# dict that specifies which filter option to pick from the API's
# unfiltered results (the POST criteria.filters endpoint doesn't work
# for narrowing, so we query with location only and post-filter).
#
# `location_level` is the DfE-native level code (e.g. "LA" for local
# authorities, "NAT" for national, "REG" for region). The adapter
# translates soundings place_id → DfE location code via place mapping.
#
# Discovery: query GET /v1/publications to find relevant publications,
# then GET /v1/publications/{id}/data-sets to list datasets, then
# GET /v1/data-sets/{id}/meta to find indicator IDs and filter options.
#
# Verified Jul 2026 against the live API.

mappings:

  - indicator_key: education.fsm_eligibility_share
    data_set_id: "019e7404-df19-71ce-90a8-f2e3db7dd7fa"
    indicator_id: "empgu"
    filter_selection:
      uKCo4: "gvmMO"    # Pupil eligibility → FSM eligible
      kQYhs: "f0yKY"    # Breakdown → All pupils
      X41fK: "UZb0R"    # School type → Total
    filters: {}
    location_level: "LA"
    time_period_code: "AY"
    place_type: ltla24
    unit: "proportion"
    caveats:
      - "FSM eligibility based on school census; uses 6-year-extended definition where available."

  - indicator_key: education.ks4_attainment_8
    data_set_id: "b3e19901-5d2b-b676-bb4c-e60937d74725"
    indicator_id: "S9YVx"
    filter_selection:
      uRBo4: "bVOtT"    # Disadvantaged status → Total
      lxdcB: "pcsSo"    # Ethnicity → Total
      w7Ibx: "bBiet"    # Ethnicity major → Total
      ULFRF: "Cm2Id"    # First language → Total
      okYmX: "aqzLP"    # FSM status → Total
      rtaNj: "mrV9K"    # KS2 scaled score → Total
      G7Kgr: "V8F5X"    # Mobility → Total
      3Km8u: "uiPo4"    # Prior attainment → Total
      SPIVx: "rvQNj"    # Admissions policy → Total
      ycTaB: "4Q8UZ"    # Religious character → Total
      RWdka: "WGD2b"    # Sex → Total
      bGMtT: "iFV6X"    # SEN primary need → Total
      DqsQe: "qTajG"    # SEN provision → Total
      0yZT5: "W1UF2"    # SEN status → Total
      eUpuS: "BUx7J"    # Young carer → Total
    filters: {}
    location_level: "LA"
    time_period_code: "AY"
    place_type: ltla24
    unit: "score"

  - indicator_key: education.persistent_absence_share
    data_set_id: "019d209c-08dc-74b6-9edb-52d521406fcf"
    indicator_id: "TuAuP"
    filter_selection:
      daL0Z: "qYfzj"    # Absence type → Persistent absence
      OS5CL: "X5Vmf"    # School type → Total
    filters: {}
    location_level: "LA"
    time_period_code: "AY"
    place_type: ltla24
    unit: "proportion"
