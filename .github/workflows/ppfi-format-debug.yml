name: ppfi-format-debug

on:
  push:
    branches: [feat/ppfi-source-spike]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.12"
      - run: cd server && uv sync --frozen
      - name: Show Ruff format diff
        run: cd server && uv run ruff format --diff tests/test_ask_dispatcher.py
