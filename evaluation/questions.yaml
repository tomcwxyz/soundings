  - id: Q28
    question: "Which charities operate in Glasgow, and what are they focused on?"
    places: ["Glasgow"]
    intent: civil-society
    expected: gap
    tags: [civil-society, scotland, coverage]
    required_tools: [find_place, find_organisations_in_place]
    required_indicators: []
    candidate_indicator_keys: []
    expected_blocks: [text, organisations]
    success_criteria:
      - "Returns an explicit partial/unavailable result rather than a complete-looking zero."
      - "Does not present a national charity slice as Glasgow-specific."
    known_gap: "Current Find That Charity v1 supports direct lookup but not Scottish local-authority place discovery."

  - id: Q29
    question: "What is the claimant count rate in Stockton-on-Tees, and how has it changed?"
    places: ["Stockton-on-Tees"]
    intent: trend
    expected: gap
    tags: [economy, derived-measure, trend]
    required_tools: [find_place, get_trend]
    required_indicators: []
    candidate_indicator_keys: [economy.claimant_count_rate]
    expected_blocks: [text, trend-chart]
    success_criteria:
      - "Does not relabel Alternative Claimant Count totals as a rate."
      - "Explains that a denominator/derived measure is required."
    known_gap: "The former rate mapping was retired because the live Stat-Xplore product exposes counts, not the advertised proportion."

  - id: Q30
    question: "What proportion of children in Middlesbrough are in relative low-income families after housing costs?"
    places: ["Middlesbrough"]
    intent: indicator
    expected: gap
    tags: [deprivation, families, derived-measure]
    required_tools: [find_place, get_indicators]
    required_indicators: []
    candidate_indicator_keys: [deprivation.child_poverty_ahc]
    expected_blocks: [text, indicator-card]
    success_criteria:
      - "Does not return the CILIF_AHC count as a proportion."
      - "Explains that a tested denominator/derivation is needed."
    known_gap: "The live CILIF_AHC dataset exposes a count measure; the former proportion-shaped mapping was retired."
