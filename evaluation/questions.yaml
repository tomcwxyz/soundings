  - id: Q21
    question: "How do Sheffield and Middlesbrough differ across population, employment, health and deprivation?"
    places: ["Sheffield", "Middlesbrough"]
    intent: compare
    expected: supported
    tags: [comparison, cross-domain]
    required_tools: [find_place, compare_places]
    required_indicators:
      - population.total
      - economy.employment_rate
      - health.life_expectancy.male
      - deprivation.imd.score
    candidate_indicator_keys: []
    expected_blocks: [text, compare-chart]
    success_criteria:
      - "Compares like-for-like indicators and periods."
      - "Does not collapse several domains into a single unsupported score."

  - id: Q22
    question: "How common is overcrowding in Birmingham?"
    places: ["Birmingham"]
    intent: indicator
    expected: supported
    tags: [housing, census]
    required_tools: [find_place, get_indicators]
    required_indicators: [housing.overcrowding_share]
    candidate_indicator_keys: []
    expected_blocks: [text, indicator-card]
    success_criteria:
      - "Uses the Census occupancy-rating derived measure."
      - "States that the measure is Census-based rather than current monthly data."

  - id: Q23
    question: "How affordable is housing in Bristol compared with similar places?"
    places: ["Bristol"]
    intent: compare
    expected: partial
    tags: [housing, affordability, peers]
    required_tools: [find_place, compare_places]
    required_indicators: [housing.affordability_ratio]
    candidate_indicator_keys: []
    expected_blocks: [text, compare-chart]
    success_criteria:
      - "If data are unavailable, says so rather than substituting another housing measure."
      - "If available, explains what the ratio means."
    known_gap: "The current affordability mapping has not been live-verified in this consolidation."

  - id: Q24
    question: "What has got noticeably worse in Sunderland in the last few years?"
    places: ["Sunderland"]
    intent: insight
    expected: partial
    tags: [trend, cross-domain, insight]
    required_tools: [find_place, detect_insights, get_trend]
    required_indicators: []
    candidate_indicator_keys: []
    expected_blocks: [text, insight-callout, trend-chart]
    success_criteria:
      - "Compares actual time series rather than inferring decline from a single snapshot."
      - "Distinguishes different update cadences."
    known_gap: "Not every catalogue domain has comparable multi-year series at LTLA level."

  - id: Q25
    question: "What pressures are families in Stockton-on-Tees facing?"
    places: ["Stockton-on-Tees"]
    intent: synthesis
    expected: partial
    tags: [families, cross-domain]
    required_tools: [find_place, get_indicators, detect_insights]
    required_indicators:
      - education.fsm_eligibility_share
      - economy.universal_credit_claimants
      - housing.overcrowding_share
    candidate_indicator_keys: [deprivation.child_poverty_ahc]
    expected_blocks: [text, indicator-card, insight-callout]
    success_criteria:
      - "Uses several signals and calls them signals/proxies where appropriate."
      - "Does not invent a child-poverty rate."
    known_gap: "The direct AHC child-poverty proportion was retired pending an explicit tested derivation."

  - id: Q26
    question: "Summarise Glasgow."
    places: ["Glasgow"]
    intent: summary
    expected: partial
    tags: [summary, scotland, coverage]
    required_tools: [find_place, get_place_profile, detect_insights]
    required_indicators: [population.total, economy.universal_credit_claimants]
    candidate_indicator_keys: []
    expected_blocks: [text, indicator-card]
    success_criteria:
      - "Uses UK-wide data where available."
      - "Explicitly marks England-only gaps rather than implying full UK parity."
    known_gap: "Several high-value sources and deprivation measures are England-only."

  - id: Q27
    question: "Summarise Belfast."
    places: ["Belfast"]
