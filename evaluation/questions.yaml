version: 1

# Curated baseline for Phase 6.5. These are evaluation hypotheses, not claims
# that the current product already answers every question well.
questions:
  - id: Q01
    question: "Summarise Stockton-on-Tees."
    places: ["Stockton-on-Tees"]
    intent: summary
    expected: supported
    tags: [summary, cross-domain]
    required_tools: [find_place, get_place_profile, detect_insights]
    required_indicators: []
    candidate_indicator_keys: []
    expected_blocks: [text, indicator-card, insight-callout]
    success_criteria:
      - "Uses several domains rather than a single headline statistic."
      - "Names material caveats or coverage limits."
      - "Keeps claims grounded in Soundings sources."

  - id: Q02
    question: "How does Sheffield compare with similar places?"
    places: ["Sheffield"]
    intent: compare
    expected: supported
    tags: [comparison, peers]
    required_tools: [find_place, compare_places, get_peer_distribution]
    required_indicators: [population.total, economy.employment_rate]
    candidate_indicator_keys: []
    expected_blocks: [text, compare-chart, distribution-chart]
    success_criteria:
      - "Uses an explicit peer comparison rather than a national comparison by default."
      - "Explains whether differences are large or modest."

  - id: Q03
    question: "What are the most deprived neighbourhoods in Middlesbrough?"
    places: ["Middlesbrough"]
    intent: neighbourhood
    expected: supported
    tags: [deprivation, neighbourhood]
    required_tools: [find_place, get_sub_areas]
    required_indicators: [deprivation.imd.score, deprivation.imd.decile]
    candidate_indicator_keys: []
    expected_blocks: [text, sub-area-table, map]
    success_criteria:
      - "Uses LSOA-level data rather than treating the whole authority as one neighbourhood."
      - "Does not imply that rank is a measure of absolute change."

  - id: Q04
    question: "Which neighbourhoods in Leeds have the highest income deprivation?"
    places: ["Leeds"]
    intent: neighbourhood
    expected: supported
    tags: [deprivation, income, neighbourhood]
    required_tools: [find_place, get_sub_areas]
    required_indicators: [deprivation.imd.income_score]
    candidate_indicator_keys: []
    expected_blocks: [sub-area-table, map]
    success_criteria:
      - "Ranks or highlights sub-areas using the income domain."
      - "Keeps the geography level explicit."

  - id: Q05
    question: "Is Newcastle's population growing or shrinking?"
    places: ["Newcastle upon Tyne"]
    intent: trend
    expected: supported
    tags: [population, trend]
    required_tools: [find_place, get_trend]
    required_indicators: [population.total]
    candidate_indicator_keys: []
    expected_blocks: [text, trend-chart]
    success_criteria:
      - "Uses multiple periods rather than comparing one value with an unstated baseline."
      - "States the period covered."

  - id: Q06
    question: "How has the number of people on Universal Credit changed in Stockton-on-Tees?"
    places: ["Stockton-on-Tees"]
    intent: trend
    expected: supported
    tags: [economy, welfare, trend]
    required_tools: [find_place, get_trend]
    required_indicators: [economy.universal_credit_claimants]
    candidate_indicator_keys: []
    expected_blocks: [text, trend-chart]
    success_criteria:
      - "Uses the live-verified Stat-Xplore series."
      - "Reports counts as people, not as a claimant rate."

  - id: Q07
    question: "How does Sunderland's employment rate compare with peers?"
    places: ["Sunderland"]
