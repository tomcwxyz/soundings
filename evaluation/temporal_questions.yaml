version: 1

# Temporal cases are kept as a focused slice because time semantics cut across
# sources and domains. They exercise deterministic change calculations as well
# as ordinary trend retrieval.
questions:
  - id: Q33
    question: "How much has Newcastle's population changed since 2020?"
    places: ["Newcastle upon Tyne"]
    intent: change
    expected: supported
    tags: [population, trend, change]
    required_tools: [find_place, get_change, get_trend]
    required_indicators: [population.total]
    candidate_indicator_keys: []
    expected_blocks: [text, trend-chart]
    success_criteria:
      - "Uses deterministic first-to-last change rather than model arithmetic."
      - "Names the actual start and end observation periods used."
      - "Keeps the underlying population trend visible alongside the change summary."

  - id: Q34
    question: "By how much has the Universal Credit claimant count changed in Stockton-on-Tees?"
    places: ["Stockton-on-Tees"]
    intent: change
    expected: supported
    tags: [economy, welfare, trend, change]
    required_tools: [find_place, get_change]
    required_indicators: [economy.universal_credit_claimants]
    candidate_indicator_keys: []
    expected_blocks: [text]
    success_criteria:
      - "Reports the start and end claimant counts and their periods."
      - "Reports absolute change and percentage change when the starting value is non-zero."
      - "Does not relabel a claimant count as a claimant rate."

  - id: Q35
    question: "How did Middlesbrough's deprivation score change between 2019 and 2025?"
    places: ["Middlesbrough"]
    intent: change
    expected: supported
    tags: [deprivation, trend, change, edition]
    required_tools: [find_place, get_change]
    required_indicators: [deprivation.imd.score]
    candidate_indicator_keys: []
    expected_blocks: [text]
    success_criteria:
      - "Compares the 2019 and 2025 editions explicitly."
      - "Surfaces any documented series break or cross-edition comparability caveat."
      - "Does not imply that a lower or higher score is a boundary-stable comparison when caveats say otherwise."

  - id: Q36
    question: "What periods does the population trend for Sunderland actually cover?"
    places: ["Sunderland"]
    intent: temporal-coverage
    expected: supported
    tags: [population, trend, provenance]
    required_tools: [find_place, get_trend]
    required_indicators: [population.total]
    candidate_indicator_keys: []
    expected_blocks: [text, trend-chart]
    success_criteria:
      - "States the first and last observation periods rather than saying only 'over time'."
      - "Preserves source period labels while using their structured temporal semantics."

  - id: Q37
    question: "Which region contained the former Borough of Corby in 2020?"
    places: ["Corby"]
    intent: temporal-geography
    expected: partial
    tags: [geography, historical, boundaries]
    required_tools: [find_place, get_containing_places]
    required_indicators: []
    candidate_indicator_keys: []
    expected_blocks: [text]
    success_criteria:
      - "Resolves Corby for the requested historical date rather than assuming today's place identity."
      - "Uses historical boundary mode and states the 2020 boundary date used."
      - "Does not substitute current hierarchy evidence if dated CHD evidence is missing."
    known_gap: "Historical containment depends on CHD code coverage and does not yet include historical postcode membership or boundary geometries."

  - id: Q38
    question: "Are more charities being registered or removed in Gateshead over the last five years?"
    places: ["Gateshead"]
    intent: lifecycle-trend
    expected: partial
    tags: [civil-society, organisations, trend, lifecycle]
    required_tools: [find_place, get_trend]
    required_indicators:
      - civil_society.charities_registered_count
      - civil_society.charities_removed_count
    candidate_indicator_keys: []
    expected_blocks: [text, trend-chart]
    success_criteria:
      - "Compares Charity Commission registration and register-removal events over named calendar years."
      - "Does not describe register removal as the exact date an organisation closed or ceased operating."
      - "States that place attribution uses current or last-known registered-address postcode rather than historical operating geography."
      - "Makes clear that unresolved historical postcodes can make place totals incomplete."
    known_gap: "Lifecycle event geography uses current or last-known registered-address postcodes resolved through the local postcode spine; historical address and operating-area membership are not yet retained."
